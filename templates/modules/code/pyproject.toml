[project]
name = "pj-NOME"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
]

# O projeto é um PACOTE INSTALÁVEL (ADR-0027): `uv sync` o instala em editable
# no `.venv`, e o import de código próprio passa a resolver por instalação em
# vez de `cwd` + `sys.path`. É o que mata o `sys.path.insert` nos notebooks, o
# `# noqa: E402` e o unresolved import do PyCharm/VS Code de uma vez só.
# NÃO remova este bloco: sem ele o uv trata o projeto como *virtual project* e
# `src/__pkg__/` deixa de ser importável.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# O nome do PROJETO mantém o prefixo `pj_` (marca diretório de projeto); o
# nome do PACOTE DE IMPORT não (em `import` o prefixo é ruído).
[tool.hatch.build.targets.wheel]
packages = ["src/__pkg__"]

# Ativar os grupos conforme necessidade do projeto:
#   uv sync --group tabular --group viz
# Grupos opcionais — não instalam nada até `uv sync --group <nome>`.
# Para a stack de ML/dados, ative o módulo: `prumo add ml` (guia + regras),
# e instale: `uv sync --group tabular --group viz`.
[dependency-groups]
tabular = [
    "openpyxl>=3.1",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
]
viz = [
    "seaborn>=0.13",
    "matplotlib>=3.9",
    "ydata-profiling>=4.18.1",
]
viz-interactive = [
    "plotly>=5.24",
]
imaging = [
    "pydicom>=2.4",
    "nibabel>=5.2",
    "simpleitk>=2.3",
]
deep-learning = [
    "torch>=2.5",
    "torchvision>=0.20",
    "lightning>=2.4",
    "timm>=1.0",
    "albumentations>=1.4",
    "torchmetrics>=1.4",
]
tabular-boosted = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
]
data-quality = [
    "frictionless>=5.16",
    "great-expectations>=0.18",
]
dev = [
    "nbformat>=5.10.4",
    "ruff>=0.8",
]
