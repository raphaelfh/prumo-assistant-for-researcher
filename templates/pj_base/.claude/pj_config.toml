# Configurações do projeto — lidas por skills e scripts do monorepo.
# Todas as chaves são opcionais; faltantes caem no default.

[interaction]
# Idioma em que o agente conversa com você. Não muda o idioma de escrita
# ([writing].language) nem o do callout de extração ([paper_extract].language).
# Valores aceitos: "pt-BR" | "en-US"
language = "pt-BR"

[safe_outputs]
# O projeto trabalha com dado de paciente? false = revisão de literatura, dado
# público, estudo teórico. Com false, só vale a regra de dado fora do git.
patient_data = true

# Contagem de pacientes de 1 a (min_cell - 1) é suprimida ou agregada.
# 0 desliga a supressão. Comuns: 5 (default), 10, 11.
min_cell = 5

# Depois de mudar [interaction] ou [safe_outputs], rode `prumo update`: ele
# reescreve o bloco de regras do AGENTS.md, que é o que o agente lê.

[paper_extract]
# Idioma do callout auto-extraído pelo /par:paper extract.
# Citações literais no corpo (> [!quote]) permanecem no idioma original.
# Valores aceitos: "pt-BR" | "en" | "es"
language = "pt-BR"

# Caminho do template de extração (relativo à raiz do pj_*).
template = ".claude/paper_extraction.md"

[paper_extract.batch]
# Default do flag --limit de /par:paper extract.
# Acima deste valor, passe --limit N explicitamente.
default_limit = 20

# Subagents despachados em paralelo em cada onda de batch.
subagents_per_wave = 8

[writing]
# Idioma dos modos de prosa (write style/manuscript/section, protocol sap, review critique).
# Vale para o texto gerado e para as convenções aplicadas — nenhuma skill traduz
# texto existente. Documento de CEP/CONEP é sempre pt-BR, independente desta chave.
# Valores aceitos: "en-US" | "pt-BR"
language = "en-US"

[wiki]
# Reservado para futuras configs das skills wiki-* (ingest/query/lint).

[citation]
# Reservado para futuras configs das skills cite/find.
