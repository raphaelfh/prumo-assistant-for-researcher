name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project + dev deps (pelo uv.lock — determinístico)
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Lockfile em dia
        run: uv lock --check

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy

      - name: Pandoc 3.8.2 (piso do export)
        run: curl -fsSLo "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.8.2/pandoc-3.8.2-1-amd64.deb && sudo dpkg -i "$RUNNER_TEMP/pandoc.deb" && pandoc --version | head -1

      - name: Pytest
        run: uv run pytest --cov=par --cov-report=term-missing

      - name: Índices gerados em dia (constitution VII)
        run: uv run python .github/scripts/gen_indexes.py --check

      - name: Versão sincronizada nos manifests
        run: uv run python .github/scripts/sync_manifest_version.py --check
