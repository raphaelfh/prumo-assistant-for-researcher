[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "prumo-assistant-for-researcher"
description = "Knowledge, bibliography & academic writing assistant for clinical research. Lives between Zotero, Zettlr, and your agent-host."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Raphael Federicci", email = "rfh.federicci@gmail.com" },
]
requires-python = ">=3.11"
keywords = [
  "research",
  "knowledge-management",
  "bibliography",
  "zotero",
  "zettlr",
  "academic-writing",
  "clinical-research",
  "claude-code-plugin",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "tomli-w>=1.0",
  "mcp==1.28.1",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/raphaelfh/prumo-assistant-for-researcher"
Repository = "https://github.com/raphaelfh/prumo-assistant-for-researcher"
Issues = "https://github.com/raphaelfh/prumo-assistant-for-researcher/issues"

[project.scripts]
prumo = "par.cli:app"
prumo-zettlr-export = "par.domains.write.cli:zettlr_export_entry"

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  # <0.16: ruff 0.16 formata blocos de código em .md (planos/specs) — formatter
  # pinado por minor, mesma razão do cap do mypy abaixo (formato = versão).
  "ruff>=0.15.12,<0.16",
  "mypy>=1.20,<2",
  "types-PyYAML>=6.0",
]

[tool.hatch.version]
path = "src/par/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/par"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "par/_templates"
"skills" = "par/_skills"
"agents" = "par/_agents"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".github/scripts/validate_manifests.py",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
# E501: line length handled by formatter
# RUF001/RUF002/RUF003: caracteres unicode "ambíguos" — projeto é em português
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"templates/**/*.ipynb" = ["F401"]
# B008/B006: Typer.Option/Annotated requer chamadas no default — padrão da lib
"src/par/cli.py" = ["B006", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/par", "tests"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
